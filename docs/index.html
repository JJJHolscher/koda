<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Party Captions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{ --bg:#000; --fg:#fff; --dim:#8b909a; --err:#ff6b5a; color-scheme:dark;
  --caption:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg); display:flex; overflow:hidden;
  transform:rotate(180deg);   /* upside down: the mic end points up at the speaker */
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  touch-action:manipulation;
}
.stage{ flex:1; min-height:0; position:relative; overflow:hidden; margin:16px; display:flex; align-items:center; }
#text{ width:100%; font-family:var(--caption); font-weight:700; line-height:1.12;
  overflow-wrap:normal; word-break:normal; hyphens:none; white-space:normal; letter-spacing:.005em; }
#text.breakall{overflow-wrap:anywhere}
#text .interim{opacity:.72}
#text .more{color:var(--dim)}
#text.placeholder{color:var(--dim)}
#text.bad{color:var(--err)}
body.off #text:not(.placeholder){opacity:.55}
</style>
</head>
<body>
  <main class="stage" id="stage"><div id="text" class="placeholder" aria-live="polite"></div></main>
<script>
(function(){
  "use strict";
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var isAndroid = /Android/i.test(navigator.userAgent);
  var LH = 1.12;

  var stage = document.getElementById("stage");
  var textEl = document.getElementById("text");
  var rec = null, wantListening = false, generation = 0, restartTimer = null;
  var committed = "", sessionFinal = "", sessionInterim = "";
  var wakeLock = null, hasStarted = false;

  // ---------- storage (optional) ----------
  function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function save(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

  var LANG = "nl-NL";
  var errMsg = "";
  function setStatus(msg, kind){ errMsg = kind === "bad" ? msg : ""; }

  // ---------- text helpers ----------
  function clean(s){ return (s || "").replace(/\s+/g," ").trim(); }
  function join(a,b){ a = clean(a); b = clean(b); return a && b ? a + " " + b : (a || b); }
  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // ---------- fitting ----------
  function bounds(){
    var h = stage.clientHeight, w = stage.clientWidth;
    var max = Math.max(24, h / (3 * LH));           // never bigger than 3 lines fill the area
    var min = Math.max(28, Math.min(w, h) / 11);   // smallest size before old text drops off
    if (min > max) min = max;
    return {w:w, h:h, min:min, max:max};
  }
  function fitsAt(size, b){
    textEl.style.fontSize = size + "px";
    return textEl.scrollHeight <= b.h + 1 && textEl.scrollWidth <= b.w + 1;
  }
  function bestSize(b){
    if (!fitsAt(b.min, b)) return 0;
    var lo = b.min, hi = b.max;
    if (fitsAt(hi, b)) return hi;
    for (var i=0;i<14;i++){ var mid=(lo+hi)/2; if (fitsAt(mid,b)) lo=mid; else hi=mid; }
    return lo;
  }

  var tokens = [];   // [{w:"word", interim:bool}]
  function paint(from){
    var html = from > 0 ? '<span class="more">… </span>' : "";
    var f = [], it = [];
    for (var i=from;i<tokens.length;i++) (tokens[i].interim ? it : f).push(esc(tokens[i].w));
    if (f.length) html += f.join(" ");
    if (it.length) html += (f.length ? " " : "") + '<span class="interim">' + it.join(" ") + "</span>";
    textEl.innerHTML = html;
  }

  function render(){
    var finalText = cap(join(committed, sessionFinal));
    var interim = clean(sessionInterim);
    if (!finalText) interim = cap(interim);
    var b = bounds();
    textEl.classList.remove("breakall");

    textEl.classList.remove("bad");
    if (!finalText && !interim){
      textEl.classList.add("placeholder");
      if (errMsg){ textEl.classList.add("bad"); textEl.textContent = errMsg; }
      else textEl.textContent = wantListening
        ? "Listening… Double tap: mic off. Tap: wipe."
        : "Mic off. Double tap: mic on. Tap: wipe.";
      textEl.style.fontSize = Math.min(bestSize(b) || b.min, 36) + "px";
      return;
    }
    textEl.classList.remove("placeholder");
    tokens = [];
    finalText.split(" ").forEach(function(w){ if (w) tokens.push({w:w, interim:false}); });
    interim.split(" ").forEach(function(w){ if (w) tokens.push({w:w, interim:true}); });

    paint(0);
    var s = bestSize(b);
    if (s){ textEl.style.fontSize = s + "px"; return; }

    // Too much text: drop the oldest words so the newest always shows.
    var lo = 1, hi = tokens.length - 1, ok = tokens.length - 1;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      paint(mid);
      if (fitsAt(b.min, b)){ ok = mid; hi = mid - 1; } else lo = mid + 1;
    }
    paint(ok);
    s = bestSize(b);
    if (!s){ textEl.classList.add("breakall"); s = b.min; }
    textEl.style.fontSize = s + "px";
  }

  if (window.ResizeObserver) new ResizeObserver(function(){ render(); }).observe(stage);
  else window.addEventListener("resize", render);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);

  // ---------- wake lock ----------
  function keepAwake(){
    if (!("wakeLock" in navigator) || wakeLock) return;
    navigator.wakeLock.request("screen").then(function(l){
      wakeLock = l; l.addEventListener("release", function(){ wakeLock = null; });
    }).catch(function(){});
  }

  // ---------- speech ----------
  function startRec(){
    clearTimeout(restartTimer);
    if (!SR || !wantListening) return;
    var myGen = ++generation;
    var r = new SR();
    r.lang = LANG;
    r.interimResults = true;
    r.continuous = !isAndroid;   // Android repeats words in continuous mode, so restart per phrase there
    r.maxAlternatives = 1;
    sessionFinal = ""; sessionInterim = "";
    var startedAt = Date.now();

    r.onstart = function(){ if (myGen === generation){ setStatus(""); render(); } };
    r.onresult = function(e){
      if (myGen !== generation) return;
      var fin = [], int = [];
      for (var i=0;i<e.results.length;i++){
        var t = e.results[i][0].transcript;
        (e.results[i].isFinal ? fin : int).push(t);
      }
      sessionFinal = fin.join(" ");
      sessionInterim = int.join(" ");
      render();
    };
    r.onerror = function(e){
      if (myGen !== generation) return;
      var err = e.error;
      if (err === "not-allowed" || err === "service-not-allowed"){
        wantListening = false; updatePause();
        setStatus("Microphone is blocked. Allow the microphone for this page in the browser settings.", "bad");
      } else if (err === "audio-capture"){
        wantListening = false; updatePause();
        setStatus("No microphone found.", "bad");
      } else if (err === "network"){
        setStatus("No network. Trying again…", "bad"); render();
      } else if (err === "language-not-supported"){
        wantListening = false; updatePause();
        setStatus("This language is not available. Select a different language.", "bad");
      }
    };
    r.onend = function(){
      if (myGen !== generation) return;
      committed = join(committed, join(sessionFinal, sessionInterim));
      sessionFinal = ""; sessionInterim = "";
      rec = null;
      render();
      if (wantListening){
        var quick = Date.now() - startedAt < 1000;
        restartTimer = setTimeout(startRec, quick ? 600 : 120);
      }
    };
    rec = r;
    try { r.start(); }
    catch(err){ rec = null; restartTimer = setTimeout(startRec, 400); }
  }

  function killRec(){
    clearTimeout(restartTimer);
    generation++;                  // ignore any late events from the old session
    if (rec){ try { rec.abort(); } catch(e){} rec = null; }
  }
  function restartNow(){
    killRec();
    restartTimer = setTimeout(startRec, 250);
  }

  function updatePause(){
    document.body.classList.toggle("off", !wantListening);
    render();
  }

  function micOn(){
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen){
      try {
        var p = el.requestFullscreen({navigationUI:"hide"});
        if (p && p.then) p.then(function(){
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(function(){});
        }).catch(function(){});
      } catch(e){}
    }
    setStatus("");
    wantListening = true;
    keepAwake();
    killRec(); startRec();
    updatePause();
  }
  function micOff(){
    wantListening = false;
    clearTimeout(restartTimer);
    if (rec){ try { rec.stop(); } catch(e){} }
    updatePause();
  }
  function wipe(){
    committed = ""; sessionFinal = ""; sessionInterim = "";
    if (rec) restartNow();   // drop words the recognizer still holds
    render();
  }

  // Single tap: wipe. Double tap: mic on/off.
  var tapTimer = null;
  document.addEventListener("click", function(e){
    e.preventDefault();
    if (tapTimer){
      clearTimeout(tapTimer); tapTimer = null;
      if (!SR) return;
      if (wantListening) micOff(); else micOn();
    } else {
      tapTimer = setTimeout(function(){ tapTimer = null; wipe(); }, 300);
    }
  });

  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && wantListening){
      keepAwake();
      if (!rec) startRec();
    }
  });

  // ---------- start state ----------
  document.body.classList.add("off");
  if (!SR){
    setStatus("This browser has no speech recognition. Use Chrome on Android or Safari on iPhone.", "bad");
  } else if (!window.isSecureContext){
    setStatus("Open this page from an https:// address, or the microphone can stay off.", "bad");
  }
  render();
})();
</script>
</body>
</html>
